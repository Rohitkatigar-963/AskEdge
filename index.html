<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Student Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen gradient-bg">
    <!-- Department Selection Screen -->
    <div id="departmentScreen" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-gradient-to-br from-slate-900 via-gray-900 to-slate-800 rounded-2xl shadow-2xl p-8 max-w-2xl w-full border border-slate-600 backdrop-blur-sm">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-white mb-4">AskEDGE</h1>
                <p class="text-gray-300 text-lg">Structured Answers For Curious Engineers</p>
                <p class="text-sm text-gray-400 mt-2">Select your department to get started</p>
            </div>
            
            <div class="grid grid-cols-2 gap-6 fade-in">
                <button onclick="selectDepartment('CSE')" class="dept-btn bg-gradient-to-br from-blue-600 to-blue-800 hover:from-blue-500 hover:to-blue-700 text-white font-bold py-6 px-8 rounded-xl smooth-transition shadow-lg border border-blue-500/30 backdrop-blur-sm">
                    <div class="text-2xl mb-2">💻</div>
                    <div class="text-xl">Computer Science</div>
                    <div class="text-sm opacity-90">(CSE)</div>
                </button>
                
                <button onclick="selectDepartment('ECE')" class="dept-btn bg-gradient-to-br from-emerald-600 to-teal-800 hover:from-emerald-500 hover:to-teal-700 text-white font-bold py-6 px-8 rounded-xl smooth-transition shadow-lg border border-emerald-500/30 backdrop-blur-sm">
                    <div class="text-2xl mb-2">⚡</div>
                    <div class="text-xl">Electronics</div>
                    <div class="text-sm opacity-90">(ECE)</div>
                </button>
                
                <button onclick="selectDepartment('ME')" class="dept-btn bg-gradient-to-br from-orange-600 to-red-700 hover:from-orange-500 hover:to-red-600 text-white font-bold py-6 px-8 rounded-xl smooth-transition shadow-lg border border-orange-500/30 backdrop-blur-sm">
                    <div class="text-2xl mb-2">⚙️</div>
                    <div class="text-xl">Mechanical</div>
                    <div class="text-sm opacity-90">(ME)</div>
                </button>
                
                <button onclick="selectDepartment('CE')" class="dept-btn bg-gradient-to-br from-purple-600 to-indigo-800 hover:from-purple-500 hover:to-indigo-700 text-white font-bold py-6 px-8 rounded-xl smooth-transition shadow-lg border border-purple-500/30 backdrop-blur-sm">
                    <div class="text-2xl mb-2">🏗️</div>
                    <div class="text-xl">Civil</div>
                    <div class="text-sm opacity-90">(CE)</div>
                </button>
            </div>

        </div>
    </div>

    <!-- Chat Interface Screen -->
    <div id="chatScreen" class="hidden min-h-screen flex flex-col">
        <!-- Header -->
        <div class="bg-gradient-to-r from-slate-900 via-gray-900 to-slate-800 shadow-lg p-4 border-b border-slate-600/50 backdrop-blur-sm">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <button onclick="goBack()" class="text-gray-300 hover:text-white transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                    </button>
                    <div>
                        <h2 id="chatTitle" class="text-xl font-bold text-white"></h2>
                        <p class="text-sm text-gray-300">Ask me anything about your department!</p>
                    </div>
                </div>
                <div id="connectionStatus" class="flex items-center space-x-2">
                    <div class="w-3 h-3 bg-gray-400 rounded-full"></div>
                    <span class="text-sm text-gray-300">Ready</span>
                </div>
            </div>
        </div>

        <!-- Chat Messages -->
        <div class="flex-1 overflow-y-auto p-4 bg-gradient-to-b from-slate-800 via-gray-800 to-slate-900">
            <div class="max-w-4xl mx-auto">
                <div id="chatMessages" class="space-y-4">
                    <!-- Messages will be added here -->
                </div>
                <div id="typingIndicator" class="hidden">
                    <div class="flex items-center space-x-2 text-gray-400 p-3">
                        <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce"></div>
                        <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                        <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                        <span class="ml-2">Processing your question<span class="loading-dots"></span></span>
                    </div>
                </div>

            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-gradient-to-r from-slate-900 via-gray-900 to-slate-800 border-t border-slate-600/50 p-4 backdrop-blur-sm">
            <div class="max-w-4xl mx-auto">
                <div class="flex space-x-4">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Type your question here..." 
                        class="flex-1 bg-gradient-to-r from-slate-800 to-gray-800 border border-slate-600/50 text-white placeholder-gray-400 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 backdrop-blur-sm shadow-inner"
                        onkeypress="handleKeyPress(event)"
                    >
                    <button 
                        onclick="handleSendButtonClick()" 
                        id="sendButton"
                        class="bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white px-3 py-3 rounded-lg transition-all font-medium disabled:opacity-50 disabled:cursor-not-allowed border border-blue-500/30 shadow-lg backdrop-blur-sm min-w-[48px] flex items-center justify-center"
                    >
                        <svg id="sendIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                        </svg>
                        <svg id="pauseIcon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                        </svg>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Hidden iframe for form submission method -->
    <iframe id="hiddenFrame" name="hiddenFrame" style="display: none;"></iframe>
    <form id="hiddenForm" method="POST" target="hiddenFrame" style="display: none;">
        <input type="hidden" name="department" id="formDepartment">
        <input type="hidden" name="question" id="formQuestion">
    </form>

        <script src="script.js"></script>
</body>
</html>
